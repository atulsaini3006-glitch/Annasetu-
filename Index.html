<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnnaSetu — Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#14231c;--mut:#66756d;--line:#e1e8e3;--pri:#17a06e;--priD:#0e7a52;--soft:#e6f6ee;--red:#d8262b;--yel:#f6b73c;--blue:#2559b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:#fff;color:var(--ink);font:13.5px/1.45 Poppins,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.w{max-width:1240px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:8px;padding:9px 0;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:21px;cursor:pointer}.lg i{background:var(--pri);color:#fff;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:18px}
.lg b{color:var(--pri)}.mk{background:#fff1cc;color:#8a5a00;font-size:9px;border-radius:5px;padding:1px 5px;font-weight:700}
.pill,.sel{border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--card);font-weight:500}
.search{flex:1;min-width:180px;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px}
.search:focus-within{border-color:var(--pri)}.search input{flex:1;border:0;outline:0;background:none;padding:9px 6px;min-width:0}
.ngo{display:flex;gap:6px;align-items:center;border:1px solid var(--pri);color:var(--priD);background:var(--soft);border-radius:9px;padding:7px 10px;font-weight:600}
.ngo.off{border-color:var(--line);background:var(--card);color:var(--mut)}
.cta{background:var(--pri);color:#fff;border-radius:9px;padding:9px 14px;font-weight:700}
.ic{position:relative;font-size:18px;padding:5px}.dot{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:99px;font-size:9px;padding:0 5px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;font-weight:500;color:var(--ink);border:1px solid transparent;transition:.15s}
.chip:hover{background:var(--soft)}.chip.on{background:var(--soft);color:var(--priD);border-color:var(--pri);font-weight:600}
h2{font-size:19px;margin:24px 0 2px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);margin:0 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.bar .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.img{aspect-ratio:16/10;position:relative;display:grid;place-items:center;font-size:66px}
.img small{position:absolute;top:44px;left:9px;font-size:9px;color:#fff;opacity:.85}
.bd{position:absolute;top:8px;left:8px;display:flex;gap:4px;max-width:78%;flex-wrap:wrap}
.bd span{background:#fff;color:#14231c;font-size:10px;font-weight:600;border-radius:6px;padding:2px 7px;border:1px solid #cfe}
.bd .ai{background:#e6fbf4;color:#0b7a5b}
.fav{position:absolute;top:7px;right:7px;background:#fff;color:#14231c;border-radius:50%;width:30px;height:30px}.fav.on{color:var(--red)}
.ov{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between}
.ov b{background:rgba(10,20,15,.8);color:#fff;border-radius:7px;padding:3px 9px;font-size:13px}.ov .t{font-variant-numeric:tabular-nums}.ov .t:before{content:"● ";color:#ff5d5d}
.cb{padding:11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.cb h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:6px}.cb h3 em{font-style:normal;font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut);white-space:nowrap;font-weight:500}
.mut{color:var(--mut);font-size:12px}.row{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.g{color:var(--priD);font-weight:600}.y{color:#b57200;font-weight:600}
.btns{display:flex;gap:7px;margin-top:auto;padding-top:6px}
.btns button{flex:1;border-radius:8px;padding:8px 4px;font-weight:600;background:var(--bg);border:1px solid var(--line);font-size:12.5px}
.btns .p{background:var(--pri);color:#fff;border-color:var(--pri)}.btns .p.done{background:var(--soft);color:var(--priD)}
.lgi{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#e6f6ee}.cmx input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:6px}.tag{max-width:100%;display:inline-block;font-size:10px;font-weight:600;border-radius:6px;padding:2px 7px;background:#fff1cc;color:#7a4b00;width:max-content}
.tag.gr{background:var(--soft);color:var(--priD)}
.box{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:12px}
.h{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}.h .card{flex:0 0 255px}
.list .grid{grid-template-columns:1fr}.list .card{flex-direction:row}.list .img{width:36%;aspect-ratio:auto;min-height:150px}
.band{background:linear-gradient(120deg,#0b1730,#14305a);color:#fff;border-radius:16px;padding:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:26px}
.band .in{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;min-width:230px}
.rsv{border:2px dashed var(--pri);border-radius:14px;padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);margin-top:22px}
.tm{font-size:30px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}.two>div{border-radius:14px;padding:20px;background:var(--card);border:1px solid var(--line)}
.msg{text-align:center;padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
.sk{height:250px;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.mod.on{display:flex}
.mb{background:var(--card);border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mb .x{position:absolute;top:10px;right:10px;background:#fff;color:#111;width:32px;height:32px;border-radius:50%;z-index:2}
.kv{border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:10px 0}.kv div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.kv div:last-child{border:0}
.sc{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:700}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#14231c;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90%;text-align:center}
#rb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--pri);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));display:none;justify-content:space-between;align-items:center;gap:8px}
#rb button{background:#fff;color:var(--priD);border-radius:8px;padding:8px 12px;font-weight:700}
footer{margin-top:40px;background:var(--card);border-top:1px solid var(--line);padding:24px 0 90px}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.fc a{display:block;color:var(--mut);padding:2px 0;cursor:pointer}
.bn{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));z-index:30}.bn button{font-size:10.5px;display:flex;flex-direction:column;align-items:center}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.bn{display:flex}.hide{display:none}.img{font-size:44px}.cb h3{font-size:13px}.btns{flex-direction:column}.list .card{flex-direction:column}.list .img{width:100%}.list .grid{grid-template-columns:1fr}.h .card{flex-basis:225px}}
@media(max-width:700px){header{position:static}.hd{gap:6px}.hd>*{order:5}.lg{order:1}#nb{order:2;margin-left:auto}#listB{order:3;padding:8px 10px;font-size:12px}#locB{order:4}#lgB{order:4}#ngoB{order:4}#favB{order:4}.search{order:9;flex:1 1 100%}.pill,.ngo{padding:5px 9px;font-size:12px}.cats{position:sticky;top:0;background:#fff;z-index:15}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card:nth-child(4n+1){--ac:#17a06e}.card:nth-child(4n+2){--ac:#f28c28}.card:nth-child(4n+3){--ac:#2559b8}.card:nth-child(4n+4){--ac:#8b5cf6}
.btns .p{background:linear-gradient(135deg,#1fbf85,#0e8f62);border-color:#0e8f62;color:#fff}
.btns button:not(.p):hover{background:#e6eefb;border-color:#2559b8}
.ov b:first-child{background:linear-gradient(135deg,#0f7a55,#17a06e)}
.box{background:#e3f6f4;color:#0b5e5a}
.tag.gr{background:#dff4f6;color:#0b6470}
.tag{background:#ffeccc;color:#8a4b00}
.rsv{border-color:#f28c28;background:#fff8ee}.rsv .tm{color:#f26b1d}
.two>div:first-child{background:#fff6e8;border-color:#f6d7a8}
.two>div:last-child{background:#eaf7f0;border-color:#b9e3cf}
.two .cta:first-of-type{background:linear-gradient(135deg,#ff9f1c,#f26b1d)}
footer{border-top:4px solid;border-image:linear-gradient(90deg,#17a06e,#f6b73c,#f26b1d,#8b5cf6,#2559b8) 1}
.fc b{color:var(--priD)}
.bn button:nth-child(1){color:#0e8f62}.bn button:nth-child(2){color:#d9640f}.bn button:nth-child(3){color:#2559b8}.bn button:nth-child(4){color:#7c3aed}.bn button:nth-child(5){color:#c2185b}
.flb{border:1px solid #2559b8;color:#2559b8;background:#e6eefb;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}.flb.on{background:#2559b8;color:#fff}.btns .flb{flex:1;border-radius:8px;padding:8px;font-size:12.5px}
.sms{background:#eef6ff;border:1px solid #bcd6f5;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:12.5px}
.flb2{border:1px solid #7c3aed;color:#7c3aed;background:#f0e9fd;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700}.flb2.off{border-color:var(--line);color:var(--mut);background:var(--bg)}
